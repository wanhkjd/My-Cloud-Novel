name: Verify MVP
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # These credentials belong only to disposable CI containers, never a developer's database.
    env:
      TEST_MYSQL_HOST: 127.0.0.1
      TEST_MYSQL_PORT: "3306"
      TEST_DB_USERNAME: cloud_novel_test
      TEST_DB_PASSWORD: ci-integration-password-only
      E2E_DB_USERNAME: cloud_novel_e2e
      E2E_DB_PASSWORD: ci-browser-password-only
      TEST_REDIS_HOST: 127.0.0.1
      TEST_REDIS_PORT: "6379"
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-bootstrap-root-password-only
          MYSQL_ROOT_HOST: "%"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
          --health-start-period=20s
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Prepare isolated MySQL schemas and least-privilege accounts
        env:
          MYSQL_PWD: ci-bootstrap-root-password-only
        run: |
          mysql --protocol=TCP -h 127.0.0.1 -u root --default-character-set=utf8mb4 <<SQL
          CREATE DATABASE cloud_novel_test CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci;
          CREATE DATABASE cloud_novel_e2e CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci;
          CREATE USER 'cloud_novel_test'@'%' IDENTIFIED BY '$TEST_DB_PASSWORD';
          CREATE USER 'cloud_novel_e2e'@'%' IDENTIFIED BY '$E2E_DB_PASSWORD';
          GRANT SELECT, INSERT, UPDATE, DELETE ON cloud_novel_test.* TO 'cloud_novel_test'@'%';
          GRANT SELECT, INSERT, UPDATE, DELETE ON cloud_novel_e2e.* TO 'cloud_novel_e2e'@'%';
          SQL
          for database in cloud_novel_test cloud_novel_e2e; do
            mysql --protocol=TCP -h 127.0.0.1 -u root --default-character-set=utf8mb4 "$database" < backend/src/main/resources/schema.sql
          done
      - name: PowerShell configuration and syntax checks
        shell: pwsh
        run: ./scripts/Test-Scripts.ps1
      - name: Backend format, architecture, unit tests, real MySQL and Redis integration, JavaDoc
        working-directory: backend
        run: mvn -B -ntp verify
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Dependency audit
        working-directory: frontend
        run: npm audit --registry=https://registry.npmjs.org --audit-level=moderate
      - name: Frontend tests, types and build
        working-directory: frontend
        run: |
          npm run format:check
          npx --no-install prettier --check ../README.md "../docs/*.md" ../.github/workflows/ci.yml ../deploy/compose.redis.yml
          npm test
          npm run build
      - name: Install test browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Desktop, mobile and accessibility tests against real MySQL and Redis
        working-directory: frontend
        run: npm run test:e2e
      - name: Save verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports
          path: |
            backend/target/surefire-reports/
            backend/target/failsafe-reports/
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7
