server:
  address: 127.0.0.1
  port: 8080
  servlet:
    session:
      cookie:
        name: CLOUDNOVEL_SESSION
        path: /
        http-only: true
        same-site: lax
        secure: false
  error:
    include-message: never
    include-stacktrace: never

spring:
  # 激活的环境；具体取值放在 application-dev.yml（被 git 忽略），模板见 application-dev.yml.example。
  profiles:
    active: dev
  application:
    name: my-cloud-novel
  # MySQL 是唯一业务数据库；建库、建表、授权由用户手工完成。
  datasource:
    driver-class-name: ${cloudnovel.datasource.driver-class-name}
    url: jdbc:mysql://${cloudnovel.datasource.host}:${cloudnovel.datasource.port}/${cloudnovel.datasource.database}?characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&sslMode=DISABLED&allowPublicKeyRetrieval=true
    username: ${cloudnovel.datasource.username}
    password: ${cloudnovel.datasource.password}
    hikari:
      connection-timeout: 5000
  sql:
    init:
      mode: never
  # Redis 只保存管理员 HTTP 会话 / CSRF，不保存唯一的业务数据。
  data:
    redis:
      host: ${cloudnovel.redis.host}
      port: ${cloudnovel.redis.port}
      username: ${cloudnovel.redis.username}
      password: ${cloudnovel.redis.password}
      database: ${cloudnovel.redis.database}
      ssl:
        enabled: false
      connect-timeout: 3s
      timeout: 3s
  session:
    timeout: 12h
    redis:
      repository-type: default
      namespace: cloud-novel:session
      configure-action: none
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 26MB

# /api/health 仅检查进程；/api/ready 检查真实 MySQL / Redis，不暴露连接详情。
management:
  endpoints:
    web:
      base-path: /api
      path-mapping:
        health: ready
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never

# 只有一名管理员；原始 TXT 存放于非静态资源目录，不能随前端公开。
app:
  admin:
    username: ${cloudnovel.admin.username}
    password: ${cloudnovel.admin.password}
  storage-directory: ${cloudnovel.storage-directory}

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    arg-name-based-constructor-auto-mapping: true
