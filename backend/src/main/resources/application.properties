spring.application.name=my-cloud-novel
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${SERVER_PORT:8080}
server.servlet.session.timeout=12h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}

# MySQL is required. The application never creates databases/tables or falls back to an embedded store.
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.sql.init.mode=never
spring.datasource.hikari.connection-timeout=5000

# Redis stores HTTP sessions / CSRF only, never the sole copy of reading data.
spring.data.redis.host=${REDIS_HOST:127.0.0.1}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.username=${REDIS_USERNAME:}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.database=${REDIS_DATABASE:0}
spring.data.redis.ssl.enabled=${REDIS_SSL:false}
spring.data.redis.connect-timeout=3s
spring.data.redis.timeout=3s
spring.session.timeout=12h
spring.session.redis.repository-type=default
spring.session.redis.namespace=${REDIS_NAMESPACE:cloud-novel:session}
spring.session.redis.configure-action=none

# Liveness remains /api/health. Readiness checks real MySQL and Redis, with no connection details exposed.
management.endpoints.web.base-path=/api
management.endpoints.web.path-mapping.health=ready
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never

spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=26MB
server.error.include-message=never
server.error.include-stacktrace=never
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:}
app.storage-directory=${BOOK_STORAGE:./data/books}

# MyBatis: SQL stays in Mapper XML; records are mapped by component names.
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.arg-name-based-constructor-auto-mapping=true
