# Start manually with: docker compose --env-file .env -f deploy/compose.redis.yml up -d
# Existing host MySQL is not managed by this compose file.
services:
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?Generate and apply your private local environment first}
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - type: bind
        source: ../.local/setup/redis.conf
        target: /usr/local/etc/redis/redis.conf
        read_only: true
        bind:
          create_host_path: false
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  redis-data:
