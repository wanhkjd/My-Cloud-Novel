<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>藏书星河</title>
    <link rel="icon" href="data:," />
    <style>
      :root {
        --ink: #e8ecff;
        --serif: 'Noto Serif SC', 'Source Han Serif SC', 'Songti SC', 'SimSun', Georgia, serif;
        --sans: Inter, 'Segoe UI', 'Microsoft YaHei', sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
      }
      body {
        min-height: 100vh;
        background: radial-gradient(1200px 900px at 50% 35%, #0a1030 0%, #070a1c 55%, #05060f 100%);
        color: var(--ink);
        font-family: var(--sans);
        overflow: hidden;
      }
      /* 粒子星野：铺满全屏、置于最底层，鼠标事件交给上层书星处理。 */
      #field {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
        display: block;
      }
      .starmap {
        position: relative;
        z-index: 1;
        min-height: 100vh;
        pointer-events: none;
      }
      .head {
        text-align: center;
        padding: 12vh 1.5rem 0;
      }
      .head .eyebrow {
        font-size: 12px;
        letter-spacing: 0.5em;
        color: #9fb0ff;
        margin: 0 0 1rem;
      }
      .head h1 {
        font-family: var(--serif);
        font-weight: 600;
        font-size: clamp(30px, 5vw, 52px);
        letter-spacing: 0.16em;
        margin: 0;
        text-shadow: 0 0 26px rgba(142, 162, 255, 0.5);
      }
      .head p {
        color: #c2ccf2;
        font-size: 14px;
        margin: 1rem auto 0;
        max-width: 30rem;
        line-height: 1.9;
      }
      /* 书星点击后浮出的小卡片：书名 + 进入。 */
      .book-pop {
        position: absolute;
        z-index: 3;
        transform: translate(-50%, calc(-100% - 18px));
        min-width: 168px;
        padding: 14px 16px 15px;
        border-radius: 14px;
        background: rgba(16, 22, 46, 0.82);
        border: 1px solid rgba(142, 162, 255, 0.35);
        box-shadow: 0 16px 44px rgba(4, 8, 22, 0.66);
        backdrop-filter: blur(8px);
        pointer-events: auto;
        opacity: 0;
        visibility: hidden;
        transition:
          opacity 0.18s ease,
          transform 0.18s ease;
      }
      .book-pop.open {
        opacity: 1;
        visibility: visible;
        transform: translate(-50%, calc(-100% - 26px));
      }
      .book-pop::after {
        content: '';
        position: absolute;
        left: 50%;
        bottom: -7px;
        width: 12px;
        height: 12px;
        transform: translateX(-50%) rotate(45deg);
        background: rgba(16, 22, 46, 0.82);
        border-right: 1px solid rgba(142, 162, 255, 0.35);
        border-bottom: 1px solid rgba(142, 162, 255, 0.35);
      }
      .pop-title {
        display: block;
        font-family: var(--serif);
        font-size: 1.05rem;
        letter-spacing: 1px;
      }
      .pop-author {
        display: block;
        margin-top: 3px;
        font-size: 12px;
        color: #aeb9e4;
      }
      .pop-enter {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        margin-top: 11px;
        padding: 6px 12px;
        border-radius: 999px;
        background: rgba(142, 162, 255, 0.16);
        border: 1px solid rgba(142, 162, 255, 0.4);
        color: #dbe4ff;
        font-size: 12px;
        text-decoration: none;
        cursor: pointer;
      }
      .pop-enter:hover {
        background: rgba(142, 162, 255, 0.3);
      }
      @media (prefers-reduced-motion: reduce) {
        .book-pop {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="field" aria-hidden="true"></canvas>
    <div class="starmap">
      <header class="head">
        <p class="eyebrow">READING CONSTELLATION</p>
        <h1>藏书星河</h1>
        <p>每一本书都是一颗星，点亮它，翻开这一本。</p>
      </header>
      <div id="pop" class="book-pop" role="dialog" aria-modal="false" aria-label="书籍信息">
        <span class="pop-title" id="popTitle"></span>
        <span class="pop-author" id="popAuthor"></span>
        <a class="pop-enter" id="popEnter" href="#">进入 →</a>
      </div>
    </div>
    <script>
      // 一条弯曲、会流动的星河横贯中央；两侧散布明亮可点的书星。纯视觉演示。
      // 星点风格延续 reactbits <Particles/> 的柔和光点与闪烁，端口为零依赖 Canvas 2D。
      (() => {
        const canvas = document.getElementById('field');
        const ctx = canvas.getContext('2d');
        const pop = document.getElementById('pop');
        const popTitle = document.getElementById('popTitle');
        const popAuthor = document.getElementById('popAuthor');
        const popEnter = document.getElementById('popEnter');
        if (!ctx) return;

        const reduceMotion =
          window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        const SPEED = 0.12; // 动画节奏
        let A1 = 90, // 星河弯曲幅度（resize 时按屏宽设定）
          A2 = 46;
        // 书籍 = 明亮显眼的星，沿星河两侧分布。u=竖直位置(0..1)，off=相对河心的左右偏移(占屏宽比例)。
        const BOOKS = [
          { t: '山海拾遗', a: '佚名', u: 0.24, off: -0.14 },
          { t: '夜航船札记', a: '佚名', u: 0.3, off: 0.19 },
          { t: '星子与灯', a: '林未晞', u: 0.37, off: -0.2 },
          { t: '春山可望', a: '沈砚', u: 0.44, off: 0.12 },
          { t: '长夜行舟', a: '陆时砚', u: 0.5, off: 0.21 },
          { t: '归乡记', a: '苏晚', u: 0.57, off: -0.16 },
          { t: '万木深', a: '周照', u: 0.63, off: 0.14 },
          { t: '观星录', a: '裴远', u: 0.7, off: -0.22 },
          { t: '空山集', a: '樊照', u: 0.77, off: 0.18 },
          { t: '拾光者', a: '安宁', u: 0.83, off: -0.12 },
          { t: '尘世绘', a: '孟晓', u: 0.9, off: 0.17 },
          { t: '海边的信', a: '林越', u: 0.95, off: -0.19 },
        ];

        let W = 0,
          H = 0,
          dpr = 1;
        let elapsed = 0,
          flow = 0,
          raf = 0,
          openIndex = -1; // 当前展开的书星索引
        let ambient = [];
        let stream = [];
        let nebula = null; // 预渲染的弯曲星河辉光
        BOOKS.forEach((b) => {
          b.ph = Math.random() * 6.28;
          b.sr = 0; // 屏幕半径（0=不可点）
        });

        // 星河中心线 x：两条不同频率的正弦叠加 => 自然弯曲（非笔直）；以 y/H 为相位，竖直无缝。
        function bandX(y) {
          const p = (y / H) * Math.PI * 2;
          return W / 2 + A1 * Math.sin(p) + A2 * Math.sin(2 * p + 1.1);
        }
        const sigma = () => W * 0.14; // 星河横向柔和半宽
        // 到河心的接近度 0..1，驱动星星的密度与亮度。
        function closeness(x, y) {
          const d = (x - bandX(y)) / sigma();
          return Math.exp(-d * d);
        }

        function makeAmbient() {
          const count = Math.min(760, Math.floor((W * H) / 2200));
          ambient = [];
          let guard = 0;
          while (ambient.length < count && guard < count * 6) {
            guard++;
            const x = Math.random() * W;
            const y = Math.random() * H;
            const c = closeness(x, y);
            if (Math.random() > 0.12 + 0.88 * c) continue; // 越近星河越密
            const base = Math.pow(Math.random(), 2.4); // 多数很暗
            const warm = Math.random() < 0.1;
            const col = warm ? [245, 220, 190] : [(210 + Math.random() * 30) | 0, 224, 255];
            ambient.push({
              x,
              y,
              size: 0.5 + base * 1.8,
              mag: (0.14 + 0.86 * base) * (0.3 + 0.7 * c),
              col,
              tw: 0.6 + Math.random() * 1.8,
              ph: Math.random() * 6.28,
            });
          }
        }
        // 河中流动的星：贴着中心线并带横向抖动，持续下移循环 => 星河在“流”。
        function makeStream() {
          const count = Math.min(260, Math.floor((W * H) / 6500));
          stream = [];
          for (let i = 0; i < count; i++) {
            stream.push({
              u: Math.random(),
              jitter: (Math.random() - 0.5) * sigma() * 1.2,
              size: 0.5 + Math.random() * 1.2,
              mag: 0.35 + Math.random() * 0.65,
              tw: 0.6 + Math.random() * 1.8,
              ph: Math.random() * 6.28,
              sp: 0.6 + Math.random() * 0.8,
            });
          }
        }
        // 预渲染弯曲星河辉光到离屏画布（竖直无缝平铺）。
        function makeNebula() {
          const off = document.createElement('canvas');
          off.width = Math.floor(W * dpr);
          off.height = Math.floor(H * dpr);
          const g = off.getContext('2d');
          g.scale(dpr, dpr);
          g.globalCompositeOperation = 'lighter';
          const cols = [
            [96, 120, 235],
            [140, 110, 216],
            [80, 150, 205],
          ];
          for (let y = 0; y < H; y += 24) {
            const x = bandX(y);
            const col = cols[(Math.random() * cols.length) | 0];
            const rad = sigma() * (0.9 + Math.random() * 0.5);
            const a = 0.05 + Math.random() * 0.05;
            for (const dy of [-H, 0, H]) {
              const gr = g.createRadialGradient(x, y + dy, 0, x, y + dy, rad);
              gr.addColorStop(0, 'rgba(' + col[0] + ',' + col[1] + ',' + col[2] + ',' + a + ')');
              gr.addColorStop(1, 'rgba(' + col[0] + ',' + col[1] + ',' + col[2] + ',0)');
              g.fillStyle = gr;
              g.beginPath();
              g.arc(x, y + dy, rad, 0, 6.283);
              g.fill();
            }
          }
          nebula = off;
        }
        function resize() {
          dpr = Math.min(window.devicePixelRatio || 1, 2);
          W = window.innerWidth || document.documentElement.clientWidth || 1280;
          H = window.innerHeight || document.documentElement.clientHeight || 800;
          canvas.width = Math.floor(W * dpr);
          canvas.height = Math.floor(H * dpr);
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          A1 = W * 0.07;
          A2 = W * 0.036;
          makeAmbient();
          makeStream();
          makeNebula();
        }
        function drawNebula() {
          if (nebula) ctx.drawImage(nebula, 0, 0, W, H);
        }
        function drawAmbient() {
          const t = elapsed * 0.001;
          for (const s of ambient) {
            const tw = reduceMotion ? 1 : 0.65 + 0.35 * Math.sin(t * s.tw + s.ph);
            const a = Math.min(1, s.mag * tw);
            const sh = 1 + 0.1 * Math.sin(t + s.ph); // 轻微色彩流动
            const rr = Math.min(255, s.col[0] * sh) | 0;
            const gg = Math.min(255, s.col[1] * sh) | 0;
            const bb = Math.min(255, s.col[2] * sh) | 0;
            ctx.fillStyle = 'rgba(' + rr + ',' + gg + ',' + bb + ',' + a + ')';
            ctx.beginPath();
            ctx.arc(s.x, s.y, s.size, 0, 6.283);
            ctx.fill();
          }
        }
        function drawStream() {
          const t = elapsed * 0.001;
          for (const s of stream) {
            const y = ((s.u + flow * s.sp) % 1) * H;
            const x = bandX(y) + s.jitter;
            const tw = reduceMotion ? 1 : 0.6 + 0.4 * Math.sin(t * s.tw + s.ph);
            ctx.fillStyle = 'rgba(206,220,255,' + Math.min(1, s.mag * tw) + ')';
            ctx.beginPath();
            ctx.arc(x, y, s.size, 0, 6.283);
            ctx.fill();
          }
        }
        function drawBooks() {
          const t = elapsed * 0.001;
          for (const b of BOOKS) {
            const y = b.u * H;
            const x = bandX(y) + b.off * W;
            b.sx = x;
            b.sy = y;
            const pulse = reduceMotion ? 1 : 0.85 + 0.15 * Math.sin(t * 2 + b.ph);
            const core = 3.4 * pulse;
            b.sr = core;
            const halo = core * 5;
            const g = ctx.createRadialGradient(x, y, 0, x, y, halo);
            g.addColorStop(0, 'rgba(224,232,255,0.6)');
            g.addColorStop(0.4, 'rgba(150,175,255,0.24)');
            g.addColorStop(1, 'rgba(150,175,255,0)');
            ctx.fillStyle = g;
            ctx.beginPath();
            ctx.arc(x, y, halo, 0, 6.283);
            ctx.fill();
            ctx.fillStyle = 'rgba(245,249,255,0.98)';
            ctx.beginPath();
            ctx.arc(x, y, core, 0, 6.283);
            ctx.fill();
          }
        }
        function render() {
          ctx.clearRect(0, 0, W, H);
          drawNebula();
          ctx.globalCompositeOperation = 'lighter';
          drawAmbient();
          drawStream();
          ctx.globalCompositeOperation = 'source-over';
          drawBooks();
          if (openIndex >= 0) positionPop(BOOKS[openIndex]);
        }
        function frame() {
          elapsed += 16 * SPEED; // 稳定步进
          if (!reduceMotion) flow += 0.0008; // 星河向下流动
          render();
          raf = requestAnimationFrame(frame);
        }
        function positionPop(b) {
          pop.style.left = b.sx + 'px';
          pop.style.top = b.sy + 'px';
        }
        function openBook(i) {
          openIndex = i;
          const b = BOOKS[i];
          popTitle.textContent = b.t;
          popAuthor.textContent = b.a + ' · 著';
          popEnter.setAttribute('href', '#/book/' + (i + 1)); // 占位链接，未实现具体跳转
          positionPop(b);
          pop.classList.add('open');
        }
        function closeBook() {
          openIndex = -1;
          pop.classList.remove('open');
        }
        function hit(mx, my) {
          for (let i = 0; i < BOOKS.length; i++) {
            const b = BOOKS[i];
            if (!b.sr) continue;
            if (Math.hypot(mx - b.sx, my - b.sy) <= Math.max(14, b.sr + 10)) return i;
          }
          return -1;
        }
        canvas.addEventListener('click', (e) => {
          const r = canvas.getBoundingClientRect();
          const i = hit(e.clientX - r.left, e.clientY - r.top);
          if (i >= 0) openBook(i);
          else closeBook();
        });
        canvas.addEventListener('mousemove', (e) => {
          const r = canvas.getBoundingClientRect();
          canvas.style.cursor = hit(e.clientX - r.left, e.clientY - r.top) >= 0 ? 'pointer' : 'default';
        });
        pop.addEventListener('click', (e) => e.stopPropagation()); // 卡片内点击不关闭
        document.addEventListener('keydown', (e) => {
          if (e.key === 'Escape') closeBook();
        });
        window.addEventListener(
          'resize',
          () => {
            resize();
            if (reduceMotion) render();
          },
          { passive: true },
        );

        resize();
        if (reduceMotion) render();
        else raf = requestAnimationFrame(frame);
      })();
    </script>
  </body>
</html>
