<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>藏书星河</title>
    <link rel="icon" href="data:," />
    <style>
      :root {
        --ink: #e8ecff;
        --serif: 'Noto Serif SC', 'Source Han Serif SC', 'Songti SC', 'SimSun', Georgia, serif;
        --sans: Inter, 'Segoe UI', 'Microsoft YaHei', sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
      }
      body {
        min-height: 100vh;
        background: radial-gradient(1200px 900px at 50% 35%, #0a1030 0%, #070a1c 55%, #05060f 100%);
        color: var(--ink);
        font-family: var(--sans);
        overflow: hidden;
      }
      /* 粒子星野：铺满全屏、置于最底层，鼠标事件交给上层书星处理。 */
      #field {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
        display: block;
      }
      .starmap {
        position: relative;
        z-index: 1;
        min-height: 100vh;
        pointer-events: none;
      }
      .head {
        text-align: center;
        padding: 12vh 1.5rem 0;
      }
      .head .eyebrow {
        font-size: 12px;
        letter-spacing: 0.5em;
        color: #9fb0ff;
        margin: 0 0 1rem;
      }
      .head h1 {
        font-family: var(--serif);
        font-weight: 600;
        font-size: clamp(30px, 5vw, 52px);
        letter-spacing: 0.16em;
        margin: 0;
        text-shadow: 0 0 26px rgba(142, 162, 255, 0.5);
      }
      .head p {
        color: #c2ccf2;
        font-size: 14px;
        margin: 1rem auto 0;
        max-width: 30rem;
        line-height: 1.9;
      }
      /* 书星点击后浮出的小卡片：书名 + 进入。 */
      .book-pop {
        position: absolute;
        z-index: 3;
        transform: translate(-50%, calc(-100% - 18px));
        min-width: 168px;
        padding: 14px 16px 15px;
        border-radius: 14px;
        background: rgba(16, 22, 46, 0.82);
        border: 1px solid rgba(142, 162, 255, 0.35);
        box-shadow: 0 16px 44px rgba(4, 8, 22, 0.66);
        backdrop-filter: blur(8px);
        pointer-events: auto;
        opacity: 0;
        visibility: hidden;
        transition:
          opacity 0.18s ease,
          transform 0.18s ease;
      }
      .book-pop.open {
        opacity: 1;
        visibility: visible;
        transform: translate(-50%, calc(-100% - 26px));
      }
      .book-pop::after {
        content: '';
        position: absolute;
        left: 50%;
        bottom: -7px;
        width: 12px;
        height: 12px;
        transform: translateX(-50%) rotate(45deg);
        background: rgba(16, 22, 46, 0.82);
        border-right: 1px solid rgba(142, 162, 255, 0.35);
        border-bottom: 1px solid rgba(142, 162, 255, 0.35);
      }
      .pop-title {
        display: block;
        font-family: var(--serif);
        font-size: 1.05rem;
        letter-spacing: 1px;
      }
      .pop-author {
        display: block;
        margin-top: 3px;
        font-size: 12px;
        color: #aeb9e4;
      }
      .pop-enter {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        margin-top: 11px;
        padding: 6px 12px;
        border-radius: 999px;
        background: rgba(142, 162, 255, 0.16);
        border: 1px solid rgba(142, 162, 255, 0.4);
        color: #dbe4ff;
        font-size: 12px;
        text-decoration: none;
        cursor: pointer;
      }
      .pop-enter:hover {
        background: rgba(142, 162, 255, 0.3);
      }
      @media (prefers-reduced-motion: reduce) {
        .book-pop {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="field" aria-hidden="true"></canvas>
    <div class="starmap">
      <header class="head">
        <p class="eyebrow">READING CONSTELLATION</p>
        <h1>藏书星河</h1>
        <p>每一本书都是一颗星，点亮它，翻开这一本。</p>
      </header>
      <div id="pop" class="book-pop" role="dialog" aria-modal="false" aria-label="书籍信息">
        <span class="pop-title" id="popTitle"></span>
        <span class="pop-author" id="popAuthor"></span>
        <a class="pop-enter" id="popEnter" href="#">进入 →</a>
      </div>
    </div>
    <script>
      // 参考 reactbits <Particles/>：球体分布、正弦漂移、缓慢自转的粒子星野。
      // 端口为零依赖的 Canvas 2D 版本，保持独立单文件；书籍是其中明亮显眼的星。
      (() => {
        const canvas = document.getElementById('field');
        const ctx = canvas.getContext('2d');
        const pop = document.getElementById('pop');
        const popTitle = document.getElementById('popTitle');
        const popAuthor = document.getElementById('popAuthor');
        const popEnter = document.getElementById('popEnter');
        if (!ctx) return;

        const reduceMotion =
          window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        const SPREAD = 14; // 粒子云半径（略大于视口，填满四角）
        const CAM = 18; // 相机距离
        const SPEED = 0.12; // 动画节奏
        const AMBIENT_COLORS = [
          [214, 224, 255],
          [180, 198, 255],
          [235, 240, 255],
          [245, 220, 190], // 少量暖色星
        ];
        // 书籍 = 明亮显眼的星；点击浮出书名与「进入」。p 为三维基准位置。
        const BOOKS = [
          { t: '山海拾遗', a: '佚名', p: [-6.2, 3.4, -2.0] },
          { t: '夜航船札记', a: '佚名', p: [5.6, 4.1, 1.5] },
          { t: '星子与灯', a: '林未晞', p: [-4.8, -2.2, 2.6] },
          { t: '春山可望', a: '沈砚', p: [3.1, -3.8, -1.2] },
          { t: '长夜行舟', a: '陆时砚', p: [6.6, -0.6, 3.0] },
          { t: '归乡记', a: '苏晚', p: [-6.8, -0.4, -0.6] },
          { t: '万木深', a: '周照', p: [0.8, 5.2, 2.2] },
          { t: '观星录', a: '裴远', p: [-2.4, 5.4, 0.6] },
          { t: '空山集', a: '樊照', p: [7.4, 1.8, -2.2] },
          { t: '拾光者', a: '安宁', p: [-7.2, 2.6, 2.2] },
          { t: '尘世绘', a: '孟晓', p: [2.2, 2.4, -3.2] },
          { t: '海边的信', a: '林越', p: [4.2, -4.6, 1.0] },
        ];

        let W = 0,
          H = 0,
          dpr = 1,
          focal = 1000;
        let ambient = [];
        let elapsed = 0;
        let rotZ = 0;
        let raf = 0;
        let openIndex = -1; // 当前展开的书星索引

        const mix = (a, b, f) => a + (b - a) * f;
        // 依次绕 X、Y、Z 轴旋转一个三维点。
        function rot(x, y, z, rx, ry, rz) {
          let c = Math.cos(rx),
            s = Math.sin(rx);
          const y1 = y * c - z * s,
            z1 = y * s + z * c;
          c = Math.cos(ry);
          s = Math.sin(ry);
          const x2 = x * c + z1 * s,
            z2 = -x * s + z1 * c;
          c = Math.cos(rz);
          s = Math.sin(rz);
          return [x2 * c - y1 * s, x2 * s + y1 * c, z2];
        }
        // 单位球内均匀取点（体积均匀：半径取立方根）。
        function sphere() {
          let x, y, z, l;
          do {
            x = Math.random() * 2 - 1;
            y = Math.random() * 2 - 1;
            z = Math.random() * 2 - 1;
            l = x * x + y * y + z * z;
          } while (l > 1 || l === 0);
          const r = Math.cbrt(Math.random());
          return [x * r, y * r, z * r];
        }
        const rand4 = () => [Math.random(), Math.random(), Math.random(), Math.random()];

        function build() {
          const count = Math.min(380, Math.floor((W * H) / 4200));
          ambient = [];
          for (let i = 0; i < count; i++) {
            const s = sphere();
            ambient.push({
              x: s[0] * SPREAD,
              y: s[1] * SPREAD,
              z: s[2] * SPREAD,
              r: rand4(),
              col: AMBIENT_COLORS[(Math.random() * AMBIENT_COLORS.length) | 0],
              size: 0.9 + Math.random() * 1.6,
            });
          }
          for (const b of BOOKS) {
            b.r = rand4();
            b.sx = -999;
            b.sy = -999;
            b.sr = 0; // 当前屏幕半径（0 表示不可见/不可点）
          }
        }
        function resize() {
          dpr = Math.min(window.devicePixelRatio || 1, 2);
          W = window.innerWidth || document.documentElement.clientWidth || 1280;
          H = window.innerHeight || document.documentElement.clientHeight || 800;
          canvas.width = Math.floor(W * dpr);
          canvas.height = Math.floor(H * dpr);
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          focal = Math.min(W, H) * 1.15;
          build();
        }
        // 某基点在当前时刻（正弦漂移 + 自转）下的屏幕投影。
        function project(bx, by, bz, r, rx, ry, rz) {
          const t = elapsed * 0.001;
          const dx = Math.sin(t * r[2] + 6.28 * r[3]) * mix(0.1, 1.5, r[0]);
          const dy = Math.sin(t * r[1] + 6.28 * r[0]) * mix(0.1, 1.5, r[3]);
          const dz = Math.sin(t * r[3] + 6.28 * r[1]) * mix(0.1, 1.5, r[2]);
          const p = rot(bx + dx, by + dy, bz + dz, rx, ry, rz);
          const vz = p[2] + CAM;
          if (vz < 0.2) return null; // 相机之后，丢弃
          const k = focal / vz;
          return { x: W / 2 + p[0] * k, y: H / 2 - p[1] * k, k, vz };
        }
        function depthAlpha(vz) {
          const near = CAM - SPREAD,
            far = CAM + SPREAD;
          return Math.max(0.28, Math.min(1, 1.15 - (vz - near) / (far - near)));
        }
        function drawAmbient(rx, ry, rz) {
          const t = elapsed * 0.001;
          for (const s of ambient) {
            const pr = project(s.x, s.y, s.z, s.r, rx, ry, rz);
            if (!pr) continue;
            const tw = reduceMotion ? 1 : 0.7 + 0.3 * Math.sin(t * 1.5 + s.r[1] * 6.28);
            const a = depthAlpha(pr.vz) * tw;
            const sh = 1 + 0.12 * Math.sin(t + s.r[1] * 6.28); // 轻微色彩流动
            const rr = Math.min(255, s.col[0] * sh) | 0;
            const gg = Math.min(255, s.col[1] * sh) | 0;
            const bb = Math.min(255, s.col[2] * sh) | 0;
            const rad = Math.max(0.45, s.size * pr.k * 0.018);
            ctx.fillStyle = 'rgba(' + rr + ',' + gg + ',' + bb + ',' + a + ')';
            ctx.beginPath();
            ctx.arc(pr.x, pr.y, rad, 0, 6.283);
            ctx.fill();
          }
        }
        function drawBooks(rx, ry, rz) {
          const t = elapsed * 0.001;
          for (const b of BOOKS) {
            const pr = project(b.p[0], b.p[1], b.p[2], b.r, rx, ry, rz);
            if (!pr) {
              b.sr = 0;
              continue;
            }
            b.sx = pr.x;
            b.sy = pr.y;
            const pulse = reduceMotion ? 1 : 0.85 + 0.15 * Math.sin(t * 2 + b.r[0] * 6.28);
            const core = Math.max(2.2, 3.4 * pr.k * 0.03) * pulse;
            b.sr = core;
            const halo = core * 4.5;
            const g = ctx.createRadialGradient(pr.x, pr.y, 0, pr.x, pr.y, halo);
            g.addColorStop(0, 'rgba(224,232,255,0.55)');
            g.addColorStop(0.4, 'rgba(150,175,255,0.22)');
            g.addColorStop(1, 'rgba(150,175,255,0)');
            ctx.fillStyle = g;
            ctx.beginPath();
            ctx.arc(pr.x, pr.y, halo, 0, 6.283);
            ctx.fill();
            ctx.fillStyle = 'rgba(245,249,255,0.98)';
            ctx.beginPath();
            ctx.arc(pr.x, pr.y, core, 0, 6.283);
            ctx.fill();
          }
        }
        function render() {
          ctx.clearRect(0, 0, W, H);
          const rx = reduceMotion ? 0 : Math.sin(elapsed * 0.0002) * 0.1;
          const ry = reduceMotion ? 0 : Math.cos(elapsed * 0.0005) * 0.15;
          ctx.globalCompositeOperation = 'lighter';
          drawAmbient(rx, ry, rotZ);
          ctx.globalCompositeOperation = 'source-over';
          drawBooks(rx, ry, rotZ);
          if (openIndex >= 0) positionPop(BOOKS[openIndex]);
        }
        function frame() {
          elapsed += 16 * SPEED; // 稳定步进
          rotZ += 0.01 * SPEED;
          render();
          raf = requestAnimationFrame(frame);
        }
        function positionPop(b) {
          pop.style.left = b.sx + 'px';
          pop.style.top = b.sy + 'px';
        }
        function openBook(i) {
          openIndex = i;
          const b = BOOKS[i];
          popTitle.textContent = b.t;
          popAuthor.textContent = b.a + ' · 著';
          popEnter.setAttribute('href', '#/book/' + (i + 1)); // 占位链接，未实现具体跳转
          positionPop(b);
          pop.classList.add('open');
        }
        function closeBook() {
          openIndex = -1;
          pop.classList.remove('open');
        }
        function hit(mx, my) {
          for (let i = 0; i < BOOKS.length; i++) {
            const b = BOOKS[i];
            if (!b.sr) continue;
            if (Math.hypot(mx - b.sx, my - b.sy) <= Math.max(14, b.sr + 10)) return i;
          }
          return -1;
        }
        canvas.addEventListener('click', (e) => {
          const r = canvas.getBoundingClientRect();
          const i = hit(e.clientX - r.left, e.clientY - r.top);
          if (i >= 0) openBook(i);
          else closeBook();
        });
        canvas.addEventListener('mousemove', (e) => {
          const r = canvas.getBoundingClientRect();
          canvas.style.cursor = hit(e.clientX - r.left, e.clientY - r.top) >= 0 ? 'pointer' : 'default';
        });
        pop.addEventListener('click', (e) => e.stopPropagation()); // 卡片内点击不关闭
        document.addEventListener('keydown', (e) => {
          if (e.key === 'Escape') closeBook();
        });
        window.addEventListener(
          'resize',
          () => {
            resize();
            if (reduceMotion) render();
          },
          { passive: true },
        );

        resize();
        if (reduceMotion) render();
        else raf = requestAnimationFrame(frame);
      })();
    </script>
  </body>
</html>
